name: 一個月每日時刻表打包器(手動也可)

on:
  push:
    paths:
      - 'final_train_diagram.json'
  schedule:
    - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      simulate_15th:
        description: '🧪 模擬 15 號 (純粹產出下個月的檔案)'
        required: false
        type: boolean
        default: false
      simulate_push:
        description: '🔄 模擬總表更新 (強制更新 當日~月底 的檔案)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write 

jobs:
  monthly-pack:
    runs-on: ubuntu-latest
    
    steps:
      - name: 下載你的程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 執行每月打包器
        env:
          EVENT_NAME: ${{ github.event_name }}
          SIMULATE_15TH: ${{ inputs.simulate_15th }}
          SIMULATE_PUSH: ${{ inputs.simulate_push }}
        run: python change/auto_monthly_packager.py

      - name: 上傳每日 JSON 日期檔
        run: |
          git config --global user.name "Packager Bot"
          git config --global user.email "bot@github.com"
          
          git add data/
          
          if git diff-index --quiet HEAD --; then
            echo "沒有檔案變動，略過提交。"
          else
            git commit -m "📦 自動產出/更新時刻表 JSON 日期檔 [skip ci]"
            git push
          fi
