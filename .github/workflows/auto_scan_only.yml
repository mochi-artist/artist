name: 每日台鐵偵察兵 (純紀錄)

# 觸發時間：每天台灣時間中午 12:00 (UTC 4:00)
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # 讓你可以手動按按鈕測試

permissions:
  contents: write # 給寫入權限

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 下載你的程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝套件
        run: pip install requests

      - name: 執行偵查 (Scan Only)
        # 這支程式會自動去雲端抓字典，並讀寫 scan_history.json 以及產出菜單
        run: python auto_scan.py

      - name: 上傳偵察日記、記憶與時空菜單
        run: |
          git config --global user.name "Scout Bot"
          git config --global user.email "bot@github.com"
          
          # 🛡️ 絕對防禦修正：不使用 git add . 
          # 嚴格規定機器人每次只能上傳這三個指定的檔案，杜絕一切意外！
          git add scan_log.txt scan_history.json "data all/Revised_Epochs.json"
          
          # 提交變更 (如果沒新車、菜單也沒變，就不做任何事)
          git commit -m "📝 更新偵察日記、記憶與時空菜單 [skip ci]" || exit 0
          git push
