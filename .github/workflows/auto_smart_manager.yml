name: 每日外掛車次智慧管理員

# 觸發時間：每天台灣時間中午 12:00 (UTC 4:00)
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # 允許手動點擊測試

permissions:
  contents: write

jobs:
  run-smart-manager:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝套件
        run: pip install requests

      - name: 🚀 執行智慧管理員 (抓取原作者車次)
        run: python auto_smart_manager.py

      - name: 💾 自動提交並推播 (Commit & Push)
        run: |
          git config --global user.name "Smart Manager Bot"
          git config --global user.email "bot@github.com"
          
          # 1. 追蹤 data 資料夾
          git add data/
          
          # 2. 安全處理暫存檔 (存在就加入，不存在就告訴 Git 忽略或移除追蹤)
          if [ -f pending_trains.json ]; then
            git add pending_trains.json
          else
            git rm --ignore-unmatch pending_trains.json
          fi
          
          if [ -f pending_log.txt ]; then
            git add pending_log.txt
          else
            git rm --ignore-unmatch pending_log.txt
          fi
          
          # 3. 提交變更
          if git diff-index --quiet HEAD --; then
            echo "沒有抓到新車次，略過提交。"
          else
            git commit -m "🤖 自動抓取與合併外部車次 [skip ci]"
            git push
          fi
