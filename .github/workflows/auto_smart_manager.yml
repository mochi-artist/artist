name: 每日外掛車次智慧管理員

# 觸發時間：每天台灣時間中午 12:00 (UTC 4:00)
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # 允許手動點擊測試

permissions:
  contents: write

jobs:
  run-smart-manager:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝套件
        run: pip install requests

      - name: 🚀 執行智慧管理員 (抓取原作者車次)
        run: python auto_smart_manager.py

      - name: 💾 自動提交並推播 (Commit & Push)
        run: |
          git config --global user.name "Smart Manager Bot"
          git config --global user.email "bot@github.com"
          
          # 1. 追蹤時刻表資料夾
          git add data/
          
          # 2. 安全處理「給程式看」的暫存 JSON 檔
          if [ -f pending_trains.json ]; then
            git add -f pending_trains.json # ⬅️ 加上 -f 強制加入
          else
            git rm --ignore-unmatch pending_trains.json
          fi
          
          # 3. 安全處理「給你看」的報告文字檔
          if [ -f catch_log.txt ]; then
            git add -f catch_log.txt # ⬅️ 加上 -f 強制加入，突破 .gitignore 限制
          else
            git rm --ignore-unmatch catch_log.txt
          fi
          
          # 4. 提交並更新
          if git diff-index --quiet HEAD --; then
            echo "沒有檔案變動，略過提交。"
          else
            git commit -m "🤖 自動抓取與合併外部車次 [skip ci]"
            git push
          fi
