<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>麻糬運行圖</title>
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="呂卓勳 Cho Husn Lu" />
    
    <link rel="icon" type="image/jpeg" href="icons/mochi.jpg" />
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="麻糬運行圖">
    
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/diagram.css">
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    
    <script>
        // 🌟 啟動 D3 繪圖引擎
        window._useD3Renderer = true;
        
        // (運轉停車的時空判斷與讀取，已全面移交給 js/diagram_d3.js 自動處理！)
    </script>

    <style>
        .loading-dots {
            display: inline-block;
            text-align: left;
        }

        .dot {
            opacity: 0; /* 預設隱藏，不影響排版寬度 */
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-timing-function: step-start; /* 瞬間切換，不做漸變 */
        }

        /* 分別給三個點指定不同的出場劇本 */
        .dot:nth-child(1) { animation-name: dot1; }
        .dot:nth-child(2) { animation-name: dot2; }
        .dot:nth-child(3) { animation-name: dot3; }

        /* 動畫劇本：利用透明度切換，這完全不佔用主執行緒，直接由 GPU 渲染 */
        @keyframes dot1 { 0% { opacity: 0; } 25%, 100% { opacity: 1; } }
        @keyframes dot2 { 0%, 25% { opacity: 0; } 50%, 100% { opacity: 1; } }
        @keyframes dot3 { 0%, 50% { opacity: 0; } 75%, 100% { opacity: 1; } }
    </style>
</head>

<body>
    <div id="popup" class="popup">
        <div class="msg">
            <h1>讀取中，請稍後<span class="loading-dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></h1>
        </div>
    </div>
</body>

<script src="js/diagram_output.js" defer></script>

</html>
