<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <title id="web_name"></title>
    <link rel="icon" type="image/jpeg" href="icons/mochi.jpg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/web.css">

    <style>
    /* ==========================================
       🌟 日曆基礎美化與格子調整 (純淨完美版)
       ========================================== */
    .zabuto_calendar table {
        border-collapse: separate !important;
        border-spacing: 2px !important; 
        width: 100% !important;
        table-layout: fixed !important; 
    }

    .zabuto_calendar table thead tr th,
    .zabuto_calendar table tbody tr td {
        width: 14.285% !important; 
        padding: 0 !important; 
    }

    /* 星期列 (淺灰色背景，文字深灰，高度適中) */
    .zabuto_calendar table thead tr th {
        background-color: #f1f5f9 !important;
        color: #475569 !important;            
        padding: 12px 0 !important;           
        font-size: 14px !important;
        font-weight: bold;
        border: none !important;
        text-align: center;
    }

    /* 日期格子本體 (統一淺米色背景，全粗體) */
    .zabuto_calendar table tbody tr td .day {
        background-color: #fff3e0 !important; 
        color: #5d4037 !important;
        border-radius: 4px !important;
        padding: 8px 0 !important; 
        font-size: 14px !important;
        font-weight: bold !important;
        border: none !important;
        text-align: center;
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
        margin: 0 !important;
    }

    /* 隱藏空日期的背景，保持乾淨 */
    .zabuto_calendar table tbody tr td:empty,
    .zabuto_calendar table tbody tr td .day:empty {
        background-color: transparent !important;
    }

    /* ==========================================
       🌟 終極控制面板：淺灰色長方形 + 兩段式年月 Bar
       ========================================== */
    .zabuto_calendar .calendar-month-header {
        display: none !important;
    }

    .custom-calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f1f5f9; 
        border-radius: 8px;        
        padding: 5px 10px;
        margin-bottom: 10px;       
    }

    .custom-calendar-header .nav-btn {
        background: transparent;
        border: none;
        font-size: 1.2rem;
        color: #475569;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 6px;
    }
    
    .custom-calendar-header .nav-btn:hover {
        background-color: #e2e8f0;
    }

    .custom-title-container {
        position: relative;
        flex-grow: 1;
        font-size: 1.1rem;
        font-weight: bold;
        color: #1e293b;
        text-align: center;
        cursor: pointer;
        user-select: none;
        padding: 6px 10px;
        border-radius: 6px;
        transition: background-color 0.15s ease;
    }

    .custom-title-container:hover {
        background-color: #e2e8f0;
    }

    .custom-title-container span i {
        font-size: 0.85rem;
        margin-left: 6px;
        color: #64748b;
        vertical-align: middle;
        transition: transform 0.2s ease;
    }

    .custom-title-container.is-open span i {
        transform: rotate(180deg);
    }

    /* 🌟 兩段式選擇面板 (先點年份 -> 展開該年 1~12 月 Bar) */
    .ym-picker-panel {
        display: none;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
        text-align: left;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .ym-section-label {
        font-size: 12px;
        font-weight: bold;
        color: #64748b;
        margin-bottom: 6px;
    }

    .ym-year-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }

    .ym-year-bar::-webkit-scrollbar,
    .ym-month-bar::-webkit-scrollbar {
        display: none;
    }

    .ym-year-btn {
        flex: 0 0 auto;
        border: 1px solid #cbd5e1;
        background-color: #ffffff;
        color: #334155;
        font-size: 14px;
        font-weight: bold;
        padding: 6px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .ym-year-btn:hover {
        background-color: #e2e8f0;
    }

    .ym-year-btn.active {
        background-color: #0d6efd;
        border-color: #0d6efd;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(13, 110, 253, 0.3);
    }

    .ym-month-bar-wrap {
        display: none;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #e2e8f0;
    }

    .ym-month-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0 4px 0;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }

    .ym-month-btn {
        flex: 0 0 auto;
        min-width: 50px;
        border: 1px solid #f5d0a9;
        background-color: #fff3e0;
        color: #5d4037;
        font-size: 13.5px;
        font-weight: bold;
        padding: 7px 10px;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s ease;
    }

    .ym-month-btn:hover:not(:disabled) {
        background-color: #ffe0b2;
    }

    .ym-month-btn.active {
        background-color: #0d6efd;
        border-color: #0d6efd;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(13, 110, 253, 0.35);
    }

    .ym-month-btn:disabled {
        background-color: #f1f5f9;
        border-color: #e2e8f0;
        color: #94a3b8;
        opacity: 0.6;
        cursor: not-allowed;
    }
    </style>
</head>

<body>
    <navbar></navbar>

    <div class="hero-section">
        <div class="container text-center">
            <h1 class="fw-bold mb-1" id="main_title"></h1>
            <p class="text-muted mb-0">請直接點選要閱讀的日期，若無底色代表無資料。</p>
        </div>
    </div>

    <div class="container text-center py-4">
        <div class="row justify-content-center">
            <div class="col-xs-12 col-md-10 col-lg-8">
                
                <div class="custom-calendar-header" id="custom-header" style="display:none;">
                    <button id="custom-prev" class="nav-btn" type="button"><i class="fa-solid fa-chevron-left"></i></button>
                    <div class="custom-title-container" id="custom-title-trigger" title="點擊選擇年份與月份">
                        <span id="custom-title"></span>
                    </div>
                    <button id="custom-next" class="nav-btn" type="button"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <!-- 🌟 先點年份、再顯示該年 1～12 月的 Bar -->
                <div class="ym-picker-panel" id="ym-picker-panel">
                    <div class="ym-section-label">請先選擇年份：</div>
                    <div class="ym-year-bar" id="ym-year-bar"></div>

                    <div class="ym-month-bar-wrap" id="ym-month-bar-wrap">
                        <div class="ym-section-label" id="ym-month-label">選擇月份（左右滑動）：</div>
                        <div class="ym-month-bar" id="ym-month-bar"></div>
                    </div>
                </div>

                <div id="calendar-wrap">
                    <div id="my-calendar"></div>
                </div>

            </div>
        </div>
        <footer class="alert alert-warning mt-4" role="alert"></footer>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/calendar/zabuto_calendar.min.js"></script>
    <link rel="stylesheet" type="text/css" href="js/calendar/zabuto_calendar.css">
    <script src="js/url.min.js"></script>
    <script src="js/config.js"></script>

    <script>
        const owner = 'mochi-artist';                  
        const repo = 'artist';                          
        const path = 'data';                            
        const line_kind = $.url('?lineKind');          

        let globalEvents = [];
        let availableMonthsByYear = {}; // { 2025: Set([12]), 2026: Set([1..12]) }
        let currentYear, currentMonth;
        let selectedPickerYear = null;

        async function getGitHubFileNames(owner, repo, path = '') {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                let allDates = new Set(); 
                const parseDateStr = (str) => new Date(str.substring(0, 4), str.substring(4, 6) - 1, str.substring(6, 8));
                const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

                data.forEach(item => {
                    const name = item.name;
                    if (line_kind === 'LINE_Alishan' || line_kind === '林鐵') {
                        const match = name.match(/林鐵_(\d{8})~(\d{8})\.json$/);
                        if (match) {
                            const start = parseDateStr(match[1]);
                            const end = parseDateStr(match[2]);
                            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) { allDates.add(formatDate(d)); }
                        }
                    } else if (line_kind === 'thsr' || line_kind === '高鐵') {
                        const match = name.match(/高鐵_(.)_(\d{8})~(\d{8})\.json$/);
                        if (match) {
                            const weekdayMap = { "日": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6 };
                            const targetWeekday = weekdayMap[match[1]];
                            const start = parseDateStr(match[2]);
                            const end = parseDateStr(match[3]);
                            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                                if (d.getDay() === targetWeekday) { allDates.add(formatDate(d)); }
                            }
                        }
                    } else {
                        const match = name.match(/^(\d{8})\.json$/);
                        if (match) { allDates.add(formatDate(parseDateStr(match[1]))); }
                    }
                });
                return Array.from(allDates).map(date => ({ date: date, title: "SVG" }));
            } catch (error) { return []; }
        }

        $(document).ready(async function () {
            
            // ==============================================================
            // 🌟 修正版上色魔法：正確鎖定 td 來替裡面的 .day 上色！
            const d = new Date();
            const todayStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            
            $('<style>').prop('type', 'text/css').html(`
                /* 💡 尋找 ID 結尾是今日日期的 td，把它裡面的 .day 變成藍色！ */
                td[id$="${todayStr}"] .day {
                    background-color: #0d6efd !important;
                    color: white !important;
                }
            `).appendTo('head');
            // ==============================================================

            if (typeof $.fn.zabuto_calendar_language === 'function') {
                $.fn.zabuto_calendar_language = function () {
                    return {
                        month_labels: ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],
                        dow_labels: ["一","二","三","四","五","六","日"] 
                    };
                };
            }

            globalEvents = await getGitHubFileNames(owner, repo, path);
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth() + 1; 

            initCustomHeader();
            renderCalendar(currentYear, currentMonth);

            $("#main_title").text(dict_line[line_kind]);     
            $("#web_name").text(dict_line[line_kind]);       
            
            $('footer').append(footer);
            $("navbar").load("navbar.html");
        });

        function closeYmPicker() {
            $('#ym-picker-panel').slideUp(160);
            $('#custom-title-trigger').removeClass('is-open');
        }

        function renderYearBar() {
            const yearBar = $('#ym-year-bar');
            yearBar.empty();

            const sortedYears = Object.keys(availableMonthsByYear)
                .map(y => parseInt(y, 10))
                .sort((a, b) => a - b);

            sortedYears.forEach(yr => {
                const isSelected = (yr === selectedPickerYear);
                const btn = $('<button type="button" class="ym-year-btn"></button>')
                    .text(`${yr}年`)
                    .toggleClass('active', isSelected)
                    .on('click', function () {
                        selectedPickerYear = yr;
                        renderYearBar();
                        renderMonthBar(yr);
                    });
                yearBar.append(btn);
            });
        }

        function renderMonthBar(year) {
            const monthBarWrap = $('#ym-month-bar-wrap');
            const monthBar = $('#ym-month-bar');
            $('#ym-month-label').text(`${year}年 1～12 月（有底色代表有資料）：`);
            monthBar.empty();

            const validMonths = availableMonthsByYear[year] || new Set();
            let activeBtnEl = null;

            for (let m = 1; m <= 12; m++) {
                const hasData = validMonths.has(m);
                const isCurrent = (year === currentYear && m === currentMonth);

                const btn = $('<button type="button" class="ym-month-btn"></button>')
                    .text(`${m}月`)
                    .toggleClass('active', isCurrent)
                    .prop('disabled', !hasData);

                if (hasData) {
                    btn.on('click', function () {
                        currentYear = year;
                        currentMonth = m;
                        renderCalendar(currentYear, currentMonth);
                        closeYmPicker();
                    });
                }

                if (isCurrent) activeBtnEl = btn[0];
                monthBar.append(btn);
            }

            monthBarWrap.stop(true, true).slideDown(160, function () {
                if (activeBtnEl) {
                    activeBtnEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });
        }

        function initCustomHeader() {
            $('#custom-header').show();

            // 整理出各年份有哪些有資料的月份
            availableMonthsByYear = {};
            globalEvents.forEach(e => {
                const y = parseInt(e.date.substring(0, 4), 10);
                const m = parseInt(e.date.substring(5, 7), 10);
                if (!availableMonthsByYear[y]) availableMonthsByYear[y] = new Set();
                availableMonthsByYear[y].add(m);
            });

            // 若 API 暫時無資料，至少保留當年避免空白
            if (Object.keys(availableMonthsByYear).length === 0) {
                availableMonthsByYear[currentYear] = new Set([currentMonth]);
            }

            // 點擊「YYYY年MM月 ▼」：先顯示年份列，等點選年份再展開 1～12 月 Bar
            $('#custom-title-trigger').on('click', function (e) {
                e.stopPropagation();
                const panel = $('#ym-picker-panel');
                if (panel.is(':visible')) {
                    closeYmPicker();
                } else {
                    selectedPickerYear = null;
                    $('#ym-month-bar-wrap').hide();
                    renderYearBar();
                    panel.stop(true, true).slideDown(160);
                    $(this).addClass('is-open');
                }
            });

            // 點擊面板內部不觸發外部關閉
            $('#ym-picker-panel').on('click', function (e) {
                e.stopPropagation();
            });

            // 點擊頁面其他空白處自動收合面板
            $(document).on('click', function () {
                if ($('#ym-picker-panel').is(':visible')) {
                    closeYmPicker();
                }
            });

            $('#custom-prev').on('click', () => {
                currentMonth--; if (currentMonth < 1) { currentMonth = 12; currentYear--; }
                renderCalendar(currentYear, currentMonth);
                closeYmPicker();
            });

            $('#custom-next').on('click', () => {
                currentMonth++; if (currentMonth > 12) { currentMonth = 1; currentYear++; }
                renderCalendar(currentYear, currentMonth);
                closeYmPicker();
            });
        }

        function renderCalendar(year, month) {
            const mStr = String(month).padStart(2, '0');
            $('#custom-title').html(`${year}年${mStr}月 <i class="fa-solid fa-caret-down"></i>`);

            $('#calendar-wrap').html('<div id="my-calendar"></div>');

            $("#my-calendar").zabuto_calendar({
                year: year,
                month: month,
                today: false, // 💡 堅持關閉，防堵會撐胖版面的 Badge 生成！
                weekstartson: 0, 
                language: "zh-tw", 
                data: globalEvents, 
                action: function () {
                    const date = $(this).data('date'); 
                    if (!globalEvents.some(e => e.date === date)) return false;
                    const formattedDate = date.replace(/-/g, ''); 
                    const targetUrl = `diagram_output.html?formattedDate=${formattedDate}&lineKind=${line_kind}&scrollToCurrentTime=false`;
                    window.open(targetUrl, '_blank');
                }
            });
        }
    </script>
</body>
</html>
