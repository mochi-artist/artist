<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <title id="web_name"></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/web.css">

    <style>
    /* ========================================== 
       🌟 日曆基礎美化與格子嚴格限制
       ========================================== */
    .zabuto_calendar table {
        table-layout: fixed !important; 
        width: 100% !important;
        border-collapse: separate !important;
        border-spacing: 4px !important; 
    }

    .zabuto_calendar table th,
    .zabuto_calendar table td {
        width: 14.285% !important; 
        padding: 0 !important; 
        text-align: center;
        vertical-align: middle;
        border: none !important;
    }

    /* 星期列 (淺灰色背景) */
    .zabuto_calendar table thead tr th {
        background-color: #f1f5f9 !important;
        color: #475569 !important;            
        padding: 10px 0 !important;           
        font-size: 14px !important;
        font-weight: bold;
        border-radius: 4px !important;
    }

    /* 日期格子 (純淨的米色方塊) */
    .zabuto_calendar table td .day {
        background-color: #fff3e0 !important; 
        color: #5d4037 !important;
        border-radius: 4px !important;
        padding: 10px 0 !important; 
        font-size: 14px !important;
        display: block !important; 
        margin: 0 auto !important;
        box-sizing: border-box;
        width: 100%;
    }

    /* 今日或選取的格子 (藍色) - 尺寸絕對不變 */
    .zabuto_calendar table td .day.today,
    .zabuto_calendar table td .day.active {
        background-color: #0d6efd !important; 
        color: white !important;
        font-weight: bold;
    }

    /* 隱藏空日期背景 */
    .zabuto_calendar table td:empty,
    .zabuto_calendar table td .day:empty {
        background-color: transparent !important;
    }

    /* ==========================================
       🌟 控制面板：淺灰色長方形與跳轉選單
       ========================================== */
    .zabuto_calendar .calendar-month-header {
        display: none !important;
    }

    .custom-calendar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f1f5f9; 
        border-radius: 8px;        
        padding: 5px 10px;
        margin-bottom: 12px;       
    }

    .custom-calendar-header .nav-btn {
        background: transparent;
        border: none;
        font-size: 1.2rem;
        color: #475569;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 6px;
    }
    
    .custom-calendar-header .nav-btn:hover {
        background-color: #e2e8f0;
    }

    .custom-title-container {
        position: relative;
        flex-grow: 1;
        font-size: 1.1rem;
        font-weight: bold;
        color: #1e293b;
        text-align: center;
    }

    .custom-title-container span i {
        font-size: 0.8rem;
        margin-left: 6px;
        color: #64748b;
        vertical-align: middle;
    }

    .custom-title-container select {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0; cursor: pointer;
        appearance: none;
    }
    </style>
</head>

<body>
    <navbar></navbar>

    <div class="hero-section">
        <div class="container text-center">
            <h1 class="fw-bold mb-1" id="main_title"></h1>
            <p class="text-muted mb-0">請直接點選要閱讀的日期，若無底色代表無資料。</p>
        </div>
    </div>

    <div class="container text-center py-4">
        <div class="row justify-content-center">
            <div class="col-xs-12 col-md-10 col-lg-8">
                
                <div class="custom-calendar-header" id="custom-header" style="display:none;">
                    <button id="custom-prev" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
                    <div class="custom-title-container">
                        <span id="custom-title"></span>
                        <select id="custom-month-select"></select>
                    </div>
                    <button id="custom-next" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <div id="calendar-wrap">
                    <div id="my-calendar"></div>
                </div>

            </div>
        </div>
        <footer class="alert alert-warning mt-4" role="alert"></footer>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/calendar/zabuto_calendar.min.js"></script>
    <link rel="stylesheet" type="text/css" href="js/calendar/zabuto_calendar.css">
    <script src="js/url.min.js"></script>
    <script src="js/config.js"></script>

    <script>
        const owner = 'mochi-artist';                  
        const repo = 'artist';                          
        const path = 'data';                            
        const line_kind = $.url('?lineKind');          

        let globalEvents = [];
        let currentYear, currentMonth;

        async function getGitHubFileNames(owner, repo, path = '') {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                let allDates = new Set(); 
                const parseDateStr = (str) => new Date(str.substring(0, 4), str.substring(4, 6) - 1, str.substring(6, 8));
                const formatDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

                data.forEach(item => {
                    const name = item.name;
                    if (line_kind === 'LINE_Alishan' || line_kind === '林鐵') {
                        const match = name.match(/林鐵_(\d{8})~(\d{8})\.json$/);
                        if (match) {
                            const start = parseDateStr(match[1]);
                            const end = parseDateStr(match[2]);
                            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) { allDates.add(formatDate(d)); }
                        }
                    } else if (line_kind === 'thsr' || line_kind === '高鐵') {
                        const match = name.match(/高鐵_(.)_(\d{8})~(\d{8})\.json$/);
                        if (match) {
                            const weekdayMap = { "日": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6 };
                            const targetWeekday = weekdayMap[match[1]];
                            const start = parseDateStr(match[2]);
                            const end = parseDateStr(match[3]);
                            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                                if (d.getDay() === targetWeekday) { allDates.add(formatDate(d)); }
                            }
                        }
                    } else {
                        const match = name.match(/^(\d{8})\.json$/);
                        if (match) { allDates.add(formatDate(parseDateStr(match[1]))); }
                    }
                });
                return Array.from(allDates).map(date => ({ date: date, title: "SVG" }));
            } catch (error) { return []; }
        }

        $(document).ready(async function () {
            if (typeof $.fn.zabuto_calendar_language === 'function') {
                $.fn.zabuto_calendar_language = function () {
                    return {
                        month_labels: ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],
                        dow_labels: ["一","二","三","四","五","六","日"] 
                    };
                };
            }

            globalEvents = await getGitHubFileNames(owner, repo, path);
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth() + 1; 

            initCustomHeader();
            renderCalendar(currentYear, currentMonth);

            $("#main_title").text(dict_line[line_kind]);     
            $("#web_name").text(dict_line[line_kind]);       
            
            $('footer').append(footer);
            $("navbar").load("navbar.html");
        });

        function initCustomHeader() {
            $('#custom-header').show();
            const select = $('#custom-month-select');
            select.empty();

            const monthsSet = new Set();
            globalEvents.forEach(e => monthsSet.add(e.date.substring(0, 7)));
            const sortedMonths = Array.from(monthsSet).sort();
            sortedMonths.forEach(ym => {
                const [y, m] = ym.split('-');
                select.append(new Option(`${y}年${m}月`, ym));
            });

            select.on('change', function() {
                const [y, m] = $(this).val().split('-');
                currentYear = parseInt(y, 10);
                currentMonth = parseInt(m, 10);
                renderCalendar(currentYear, currentMonth);
            });

            $('#custom-prev').on('click', () => {
                currentMonth--; if (currentMonth < 1) { currentMonth = 12; currentYear--; }
                renderCalendar(currentYear, currentMonth);
            });

            $('#custom-next').on('click', () => {
                currentMonth++; if (currentMonth > 12) { currentMonth = 1; currentYear++; }
                renderCalendar(currentYear, currentMonth);
            });
        }

        function renderCalendar(year, month) {
            const mStr = String(month).padStart(2, '0');
            $('#custom-title').html(`${year}年${mStr}月 <i class="fa-solid fa-caret-down"></i>`);
            $('#custom-month-select').val(`${year}-${mStr}`);

            $('#calendar-wrap').html('<div id="my-calendar"></div>');

            $("#my-calendar").zabuto_calendar({
                year: year,
                month: month,
                today: false, // 💡 關鍵就在這行：設為 false，關閉內建的撐破螢幕的 badge
                weekstartson: 0, 
                language: "zh-tw", 
                data: globalEvents, 
                action: function () {
                    const date = $(this).data('date'); 
                    if (!globalEvents.some(e => e.date === date)) return false;
                    const formattedDate = date.replace(/-/g, ''); 
                    const targetUrl = `diagram_output.html?formattedDate=${formattedDate}&lineKind=${line_kind}&scrollToCurrentTime=false`;
                    window.open(targetUrl, '_blank');
                }
            });
        }
    </script>
</body>
</html>
