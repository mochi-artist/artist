<script>
    const owner = 'mochi-artist';                 // GitHub 使用者名稱
    const repo = 'artist';                        // GitHub 倉庫名稱
    const path = 'data';                          // GitHub 倉庫中的路徑
    const url = new URL(location.href);           // 取得當前頁面的 URL
    const line_kind = $.url('?lineKind');         // 從 URL 取得 lineKind 參數

    const kind_realtime = dict_line[line_kind];   // 取得對應的實時線路類型

    // 🌟 升級版：智慧讀取 GitHub 檔案邏輯
    async function getGitHubFileNames(owner, repo, path = '') {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`GitHub API request failed: ${response.status}`);
            const data = await response.json();

            let allDates = new Set(); // 使用 Set 來避免同一天重複亮燈

            // 輔助工具：將 "YYYYMMDD" 字串轉換為 JavaScript Date 物件
            const parseDateStr = (str) => new Date(str.substring(0, 4), str.substring(4, 6) - 1, str.substring(6, 8));
            
            // 輔助工具：將 JavaScript Date 物件轉換為 Zabuto 要求的 "YYYY-MM-DD"
            const formatDate = (d) => {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            };

            // 開始掃描 data 資料夾底下的所有檔案
            data.forEach(item => {
                const name = item.name;

                // 🌲 【林鐵模式】比對：林鐵_20260101~20260228.json
                if (line_kind === 'LINE_Alishan' || line_kind === '林鐵') {
                    const match = name.match(/林鐵_(\d{8})~(\d{8})\.json$/);
                    if (match) {
                        const start = parseDateStr(match[1]);
                        const end = parseDateStr(match[2]);
                        // 將這段期間內的每一天都加入行事曆
                        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                            allDates.add(formatDate(d));
                        }
                    }
                }
                // 🚅 【高鐵模式】比對：高鐵_一_20260202~20261231.json
                else if (line_kind === 'thsr' || line_kind === '高鐵') {
                    const match = name.match(/高鐵_(.)_(\d{8})~(\d{8})\.json$/);
                    if (match) {
                        const weekdayMap = { "日": 0, "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6 };
                        const targetWeekday = weekdayMap[match[1]];
                        const start = parseDateStr(match[2]);
                        const end = parseDateStr(match[3]);

                        // 迴圈跑這段期間，但「只把符合該星期」的日子加入
                        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                            if (d.getDay() === targetWeekday) {
                                allDates.add(formatDate(d));
                            }
                        }
                    }
                }
                // 🚂 【台鐵模式 (預設)】比對傳統格式：20260327.json
                else {
                    const match = name.match(/^(\d{8})\.json$/);
                    if (match) {
                        allDates.add(formatDate(parseDateStr(match[1])));
                    }
                }
            });

            // 將 Set 中的日期轉成 Zabuto Calendar 要求的 events 陣列格式
            const events = Array.from(allDates).map(date => ({
                date: date,
                title: "SVG available",
                body: `<p>${date.replace(/-/g, '')}.json 或相關區間檔</p>`
            }));

            return events;
        } catch (error) {
            console.error('Error fetching GitHub files:', error);
            return [];
        }
    }

    $(document).ready(async function () {
        const events = await getGitHubFileNames(owner, repo, path);

        $("#my-calendar").zabuto_calendar({
            today: true,
            weekstartson: 0,
            language: "en",
            data: events, // 直接使用我們剛剛處理好的 events
            action: function () {
                // 取得被點選的日期
                const date = $(this).data('date'); 
                // 檢查日期是否在 events 中
                const isValidDate = events.some(event => event.date === date);

                if (!isValidDate) {
                    // 如果日期不在 events 中，阻止動作
                    return false;
                }

                // 如果日期有效，執行 showDiagram 函數
                return showDiagram(this.id, false, line_kind);
            }
        });

        $("#main_title").text(dict_line[line_kind]);     // 設定網頁內文主標題
        $("#web_name").text(dict_line[line_kind]);       // 設定網頁標題
        $('footer').append(footer);
        $("navbar").load("navbar.html");
    });

    function showDiagram(id, fromModal, line_kind) {
        const date = $("#" + id).data("date");
        const formattedDate = date.replace(/-/g, ''); // 移除所有 "-"，得到 "20260327"

        if (formattedDate) {
            // 注意：這裡只負責傳遞日期參數，真正的檔案路由判斷交給 js/diagram_output.js
            const targetUrl = `diagram_output.html?formattedDate=${formattedDate}&lineKind=${line_kind}&scrollToCurrentTime=false`;
            window.open(targetUrl, '_blank');
        } else {
            alert('此日期沒有對應的 SVG 檔案。');
        }
        return true;
    }
</script>
